name: Verify site
description: Run the shared site verification gate on the current workspace.

inputs:
  unit-script:
    description: Approved package script for the unit-test portion of this gate.
    required: false
    default: test:unit

runs:
  using: composite
  steps:
    - name: Run immutable site verification gate
      shell: bash
      run: pnpm run verify:site -- --unit-script "${{ inputs.unit-script }}"
