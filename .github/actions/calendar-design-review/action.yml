name: Review calendar design and notify
description: Review the already generated site after publication and retain operational evidence.
inputs:
  git-saved:
    description: Whether the commit and push step succeeded.
    required: true
  publication-failed:
    description: Whether a blocking verification or Git publication step failed.
    required: false
    default: "false"
  failed-step:
    description: Name of the verification or publication step that actually failed.
    default: "unknown verification"
  smtp-username:
    required: true
    description: Existing calendar alert SMTP sender.
  smtp-password:
    required: true
    description: Existing calendar alert SMTP app password.
  recipient:
    required: true
    description: Existing calendar alert recipient.
runs:
  using: composite
  steps:
    - name: Emit verification failure notification
      if: ${{ inputs.publication-failed == 'true' }}
      shell: bash
      run: node --import tsx scripts/write-calendar-verification-notification.mjs
      env:
        CALENDAR_NOTIFICATIONS_REPORT_PATH: ${{ runner.temp }}/calendar-notifications.json
        CALENDAR_FAILED_STEP: ${{ inputs.failed-step }}
    - name: Review generated calendar design
      id: review
      if: ${{ inputs.git-saved == 'true' }}
      continue-on-error: true
      shell: bash
      run: pnpm run review:calendar-design
      env:
        CALENDAR_GIT_SAVED: ${{ inputs.git-saved }}
        CALENDAR_LAYOUT_REPORT_DIR: ${{ runner.temp }}/calendar-design-review
        CALENDAR_NOTIFICATIONS_REPORT_PATH: ${{ runner.temp }}/calendar-notifications.json
    - name: Report incomplete design review
      if: ${{ always() && steps.review.outcome == 'failure' }}
      shell: bash
      run: pnpm run review:calendar-design
      env:
        CALENDAR_GIT_SAVED: ${{ inputs.git-saved }}
        CALENDAR_LAYOUT_FORCE_INCOMPLETE: "true"
        CALENDAR_LAYOUT_REPORT_DIR: ${{ runner.temp }}/calendar-design-review
        CALENDAR_NOTIFICATIONS_REPORT_PATH: ${{ runner.temp }}/calendar-notifications.json
    - name: Prepare calendar notification email
      id: email
      if: ${{ always() }}
      shell: bash
      run: node scripts/write-calendar-notification-email.mjs
      env:
        CALENDAR_NOTIFICATIONS_REPORT_PATH: ${{ runner.temp }}/calendar-notifications.json
        CALENDAR_NOTIFICATION_EMAIL_PATH: ${{ runner.temp }}/calendar-notification-email.txt
        CALENDAR_ALERT_SMTP_USERNAME: ${{ inputs.smtp-username }}
        CALENDAR_ALERT_RECIPIENT: ${{ inputs.recipient }}
        CALENDAR_LAYOUT_REPORT_DIR: ${{ runner.temp }}/calendar-design-review
    - name: Send calendar notification email
      id: delivery
      if: ${{ always() && steps.email.outputs.send == 'true' }}
      shell: bash
      run: node scripts/send-calendar-notification-email.mjs
      env:
        CALENDAR_ALERT_SMTP_USERNAME: ${{ inputs.smtp-username }}
        CALENDAR_ALERT_SMTP_APP_PASSWORD: ${{ inputs.smtp-password }}
        CALENDAR_ALERT_RECIPIENT: ${{ inputs.recipient }}
        CALENDAR_NOTIFICATION_EMAIL_PATH: ${{ runner.temp }}/calendar-notification-email.txt
        CALENDAR_GIT_SAVED: ${{ inputs.git-saved }}
    - name: Locate calendar design evidence
      id: evidence
      if: ${{ always() }}
      shell: bash
      run: |
        if [[ -d "$RUNNER_TEMP/calendar-design-review" || -f "$RUNNER_TEMP/site-verification/publication.json" ]]; then
          echo "available=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Upload calendar design evidence
      if: ${{ always() && steps.evidence.outputs.available == 'true' }}
      uses: actions/upload-artifact@v6
      with:
        name: calendar-design-review
        path: |
          ${{ runner.temp }}/calendar-design-review
          ${{ runner.temp }}/site-verification/publication.json
        if-no-files-found: warn
        retention-days: 30
    - name: Upload calendar notification reports
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: calendar-notification-reports
        path: |
          ${{ runner.temp }}/calendar-historical-changes.json
          ${{ runner.temp }}/calendar-notifications.json
        if-no-files-found: warn
        retention-days: 30
