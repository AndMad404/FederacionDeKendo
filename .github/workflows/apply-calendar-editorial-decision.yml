name: Confirm or reject pending calendar event deletion
on:
  workflow_dispatch:
    inputs:
      source_id:
        description: Source identity from the pending notification
        required: true
        type: string
      revision_id:
        description: Pending revision fingerprint
        required: true
        type: string
      evidence_fingerprint:
        description: Evidence fingerprint from the same pending notification
        required: true
        type: string
      action:
        description: Recorded decision
        required: true
        type: choice
        options:
          - approve_deletion
          - reject_deletion
      decision_record_id:
        description: Non-sensitive human decision record identifier
        required: true
        type: string
      reason:
        description: Optional public-safe rationale
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: site-writer-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  prepare:
    name: Prepare and verify calendar changes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up project
        uses: ./.github/actions/setup-project
      - name: Apply exactly the notified revision
        run: |
          export CALENDAR_DECISION_DECIDED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          pnpm run apply:calendar-decision
        env:
          CALENDAR_DECISION_SOURCE_ID: ${{ inputs.source_id }}
          CALENDAR_DECISION_REVISION_ID: ${{ inputs.revision_id }}
          CALENDAR_DECISION_EVIDENCE_FINGERPRINT: ${{ inputs.evidence_fingerprint }}
          CALENDAR_DECISION_ACTION: ${{ inputs.action }}
          CALENDAR_DECISION_RECORD_ID: ${{ inputs.decision_record_id }}
          CALENDAR_DECISION_REASON: ${{ inputs.reason }}
          CALENDAR_DECISION_ACTOR_ROLE: presidencia
      - name: Verify generated site
        id: verification
        uses: ./.github/actions/verify-site
        with:
          mode: calendar
      - name: Package verified source, build and reports
        id: handoff
        if: ${{ always() }}
        run: node scripts/calendar-handoff.mjs pack
        env:
          CALENDAR_PREPARED: ${{ steps.verification.outcome == 'success' }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: calendar-handoff-${{ github.run_attempt }}
          path: ${{ runner.temp }}/calendar-handoff
          if-no-files-found: error
          retention-days: 30
        name: Retain calendar handoff
        if: ${{ always() && steps.handoff.outcome == 'success' }}
    environment: presidencia
  publish:
    name: Publish verified calendar changes
    outputs:
      git-saved: ${{ steps.publication.outputs.git-saved }}
    needs: prepare
    if: ${{ needs.prepare.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node without dependencies
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          check-latest: true
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: calendar-handoff-${{ github.run_attempt }}
          path: ${{ runner.temp }}/calendar-handoff
      - name: Publish guarded handoff
        id: publication
        run: node scripts/calendar-handoff.mjs publish
        env:
          VERIFY_SITE_REPORT_DIR: ${{ runner.temp }}/site-verification
          CALENDAR_PUBLICATION_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: calendar-publication-${{ github.run_attempt }}
          path: ${{ runner.temp }}/calendar-publication
          if-no-files-found: error
          retention-days: 30
        name: Retain publication result
        if: ${{ always() }}
    environment: presidencia
  finalize:
    name: Review verified build and notify
    needs:
      - prepare
      - publish
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up project
        uses: ./.github/actions/setup-project
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: calendar-handoff-${{ github.run_attempt }}
          path: ${{ runner.temp }}/calendar-handoff
        name: Download calendar handoff
        id: download
        continue-on-error: true
      - name: Restore verified build and notification reports
        id: restore
        if: ${{ steps.download.outcome == 'success' }}
        continue-on-error: true
        run: node scripts/calendar-handoff.mjs restore
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: calendar-publication-${{ github.run_attempt }}
          path: ${{ runner.temp }}/site-verification
        name: Download publication result
        if: ${{ needs.publish.result == 'success' }}
        continue-on-error: true
      - name: Install Chromium for design review
        if: ${{ needs.publish.result == 'success' && steps.restore.outcome == 'success' }}
        continue-on-error: true
        run: pnpm exec playwright install --with-deps chromium
      - name: Review calendar design and notify
        if: ${{ always() }}
        uses: ./.github/actions/calendar-design-review
        with:
          publication-failed: ${{ needs.prepare.result != 'success' || needs.publish.result != 'success' || steps.restore.outcome != 'success' }}
          failed-step: ${{ needs.prepare.result != 'success' && 'preparation or site verification' || needs.publish.result != 'success' && 'Git publication' || 'handoff restoration' }}
          git-saved: ${{ needs.publish.outputs.git-saved == 'true' }}
          smtp-username: ${{ secrets.CALENDAR_ALERT_SMTP_USERNAME }}
          smtp-password: ${{ secrets.CALENDAR_ALERT_SMTP_APP_PASSWORD }}
          recipient: ${{ secrets.CALENDAR_ALERT_RECIPIENT }}
env:
  CALENDAR_OPERATION: decision
