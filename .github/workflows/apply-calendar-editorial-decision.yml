name: Confirm or reject pending calendar event deletion
on:
  workflow_dispatch:
    inputs:
      source_id:
        description: Source identity from the pending notification
        required: true
        type: string
      revision_id:
        description: Pending revision fingerprint
        required: true
        type: string
      evidence_fingerprint:
        description: Evidence fingerprint from the same pending notification
        required: true
        type: string
      action:
        description: Recorded decision
        required: true
        type: choice
        options:
          - approve_deletion
          - reject_deletion
      decision_record_id:
        description: Non-sensitive human decision record identifier
        required: true
        type: string
      reason:
        description: Optional public-safe rationale
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: site-writer-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  apply-decision:
    name: Apply Presidency's recorded decision
    runs-on: ubuntu-latest
    environment: presidencia
    steps:
      - uses: actions/checkout@v5
      - name: Set up project
        uses: ./.github/actions/setup-project
      - name: Apply exactly the notified revision
        run: |
          export CALENDAR_DECISION_DECIDED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          pnpm run apply:calendar-decision
        env:
          CALENDAR_DECISION_SOURCE_ID: ${{ inputs.source_id }}
          CALENDAR_DECISION_REVISION_ID: ${{ inputs.revision_id }}
          CALENDAR_DECISION_EVIDENCE_FINGERPRINT: ${{ inputs.evidence_fingerprint }}
          CALENDAR_DECISION_ACTION: ${{ inputs.action }}
          CALENDAR_DECISION_RECORD_ID: ${{ inputs.decision_record_id }}
          CALENDAR_DECISION_REASON: ${{ inputs.reason }}
          CALENDAR_DECISION_ACTOR_ROLE: presidencia
      - name: Verify generated site
        uses: ./.github/actions/verify-site
        with:
          mode: calendar
      - name: Commit recorded decision
        run: node scripts/publish-changes.mjs decision
        env:
          VERIFY_SITE_REPORT_DIR: ${{ runner.temp }}/site-verification
        id: publication
      - name: Review calendar design and notify
        if: ${{ always() }}
        uses: ./.github/actions/calendar-design-review
        with:
          publication-failed: ${{ failure() }}
          git-saved: ${{ steps.publication.outcome == 'success' }}
          smtp-username: ${{ secrets.CALENDAR_ALERT_SMTP_USERNAME }}
          smtp-password: ${{ secrets.CALENDAR_ALERT_SMTP_APP_PASSWORD }}
          recipient: ${{ secrets.CALENDAR_ALERT_RECIPIENT }}
