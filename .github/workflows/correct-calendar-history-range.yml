name: Apply approved historical calendar range
on:
  workflow_dispatch:
    inputs:
      report_run_id:
        description: Run ID that produced the approved historical changes report
        required: true
        type: string
      from:
        description: Inclusive first historical event date (YYYY-MM-DD)
        required: true
        type: string
      to:
        description: Inclusive last historical event date (YYYY-MM-DD)
        required: true
        type: string
permissions:
  actions: read
  contents: write
concurrency:
  group: site-writer-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  correct-history:
    name: Apply approved historical range
    runs-on: ubuntu-latest
    env:
      CALENDAR_ICS_URL: ${{ secrets.CALENDAR_ICS_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Download approved historical changes report
        uses: actions/download-artifact@v5
        with:
          name: calendar-notification-reports
          run-id: ${{ inputs.report_run_id }}
          github-token: ${{ github.token }}
          path: .
      - name: Set up project
        uses: ./.github/actions/setup-project
      - name: Apply approved historical range
        run: pnpm run correct:calendar-history-range --report calendar-historical-changes.json --from "${{ inputs.from }}" --to "${{ inputs.to }}"
      - name: Import approved historical galleries
        run: pnpm run sync:approved-historical-galleries --report calendar-historical-changes.json --from "${{ inputs.from }}" --to "${{ inputs.to }}"
      - name: Remove downloaded reports
        run: rm -f calendar-historical-changes.json calendar-notifications.json
      - name: Verify generated site
        id: verification
        uses: ./.github/actions/verify-site
        with:
          mode: calendar
      - name: Commit approved historical range
        run: node scripts/publish-changes.mjs history
        env:
          VERIFY_SITE_REPORT_DIR: ${{ runner.temp }}/site-verification
        id: publication
      - name: Review calendar design and notify
        if: ${{ always() }}
        uses: ./.github/actions/calendar-design-review
        with:
          publication-failed: ${{ steps.verification.outcome == 'failure' || steps.publication.outcome == 'failure' }}
          failed-step: ${{ steps.verification.outcome == 'failure' && 'site verification' || 'Git publication' }}
          git-saved: ${{ steps.publication.outcome == 'success' }}
          smtp-username: ${{ secrets.CALENDAR_ALERT_SMTP_USERNAME }}
          smtp-password: ${{ secrets.CALENDAR_ALERT_SMTP_APP_PASSWORD }}
          recipient: ${{ secrets.CALENDAR_ALERT_RECIPIENT }}
