name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('site-writer-{0}', github.ref) || format('ci-{0}', github.ref) }}
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    name: Unit, typecheck, build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up project
        uses: ./.github/actions/setup-project

      - name: Validate pull request metadata
        if: github.event_name == 'pull_request'
        run: node scripts/validate-pull-request.mjs

      - name: Verify site
        uses: ./.github/actions/verify-site

  publish-fixes:
    name: Save verified automatic corrections
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERIFY_SITE_REPORT_DIR: .cache/verification
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          check-latest: true
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-verification-${{ github.run_attempt }}
          path: ${{ env.VERIFY_SITE_REPORT_DIR }}
      - name: Commit and push verified corrections
        run: node scripts/calendar-handoff.mjs site
        env:
          CALENDAR_PUBLICATION_TOKEN: ${{ github.token }}
      - name: Retain Git publication result
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: site-publication
          path: ${{ env.VERIFY_SITE_REPORT_DIR }}/publication.json
          if-no-files-found: warn
          retention-days: 30
