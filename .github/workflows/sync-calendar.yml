name: Sync calendar events
on:
  schedule:
    - cron: 0 9 * * *
  workflow_dispatch: null
permissions:
  contents: write
concurrency:
  group: sync-calendar-events
  cancel-in-progress: false
jobs:
  sync-calendar:
    name: Sync Google Calendar into site data
    runs-on: ubuntu-latest
    env:
      CALENDAR_ICS_URL: ${{ secrets.CALENDAR_ICS_URL }}
      CALENDAR_TIME_ZONE: America/Costa_Rica
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Enable Corepack
        run: corepack enable
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Sync calendar events
        id: sync
        run: pnpm run sync:calendar
        env:
          HISTORICAL_CHANGES_REPORT_PATH: ${{ runner.temp }}/calendar-historical-changes.json
          CALENDAR_NOTIFICATIONS_REPORT_PATH: ${{ runner.temp }}/calendar-notifications.json
      - name: Directed synchronization tests
        run: pnpm run test:sync-directed
      - name: Verify generated site
        uses: ./.github/actions/verify-site
        with:
          unit-script: test:unit:without-sync
          mode: calendar
      - name: Commit calendar changes
        run: |
          sync_paths=(
            src/app/data/calendarEvents.ts
            src/app/data/calendarEventRegistry.json
            src/app/data/eventGalleries.ts
            src/app/data/eventGalleryState.json
          )
          if [[ -d public/images/events ]] || git ls-files --error-unmatch public/images/events >/dev/null 2>&1; then
            sync_paths+=(public/images/events)
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "${sync_paths[@]}"

          if git diff --cached --quiet; then
            echo "No calendar changes to commit."
            exit 0
          fi

          git commit -m "chore: sync calendar events"
          git push
        id: publication
      - name: Emit verification failure notification
        if: ${{ failure() }}
        run: node --import tsx scripts/write-calendar-verification-notification.mjs
        env:
          CALENDAR_NOTIFICATIONS_REPORT_PATH: ${{ runner.temp }}/calendar-notifications.json
          CALENDAR_FAILED_STEP: calendar publication or blocking verification
      - name: Review calendar design and notify
        if: ${{ always() }}
        uses: ./.github/actions/calendar-design-review
        with:
          git-saved: ${{ steps.publication.outcome == 'success' }}
          smtp-username: ${{ secrets.CALENDAR_ALERT_SMTP_USERNAME }}
          smtp-password: ${{ secrets.CALENDAR_ALERT_SMTP_APP_PASSWORD }}
          recipient: ${{ secrets.CALENDAR_ALERT_RECIPIENT }}
