name: Sync calendar events

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-calendar-events
  cancel-in-progress: false

jobs:
  sync-calendar:
    name: Sync Google Calendar into site data
    runs-on: ubuntu-latest
    env:
      CALENDAR_ICS_URL: ${{ secrets.CALENDAR_ICS_URL }}
      CALENDAR_TIME_ZONE: America/Costa_Rica

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync calendar events
        id: sync
        run: pnpm run sync:calendar
        env:
          HISTORICAL_CHANGES_REPORT_PATH: ${{ runner.temp }}/calendar-historical-changes.json
          CALENDAR_NOTIFICATIONS_REPORT_PATH: ${{ runner.temp }}/calendar-notifications.json

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test:unit

      - name: Build
        run: pnpm run build

      - name: Generated output tests
        run: pnpm run test:generated

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser tests
        run: pnpm run test:e2e

      - name: Emit verification failure notification
        if: ${{ failure() && steps.sync.outcome == 'success' }}
        run: node scripts/write-calendar-verification-notification.mjs
        env:
          CALENDAR_NOTIFICATIONS_REPORT_PATH: ${{ runner.temp }}/calendar-notifications.json
          CALENDAR_FAILED_STEP: post-sync verification

      - name: Prepare calendar notification email
        id: calendar_notification_email
        if: ${{ always() }}
        run: node scripts/write-calendar-notification-email.mjs
        env:
          CALENDAR_NOTIFICATIONS_REPORT_PATH: ${{ runner.temp }}/calendar-notifications.json
          CALENDAR_NOTIFICATION_EMAIL_PATH: ${{ runner.temp }}/calendar-notification-email.txt
          CALENDAR_ALERT_SMTP_USERNAME: ${{ secrets.CALENDAR_ALERT_SMTP_USERNAME }}

      - name: Send calendar notification email
        if: ${{ always() && steps.calendar_notification_email.outputs.send == 'true' }}
        run: >-
          curl --fail --silent --show-error --url smtps://smtp.gmail.com:465 --ssl-reqd
          --user "$CALENDAR_ALERT_SMTP_USERNAME:$CALENDAR_ALERT_SMTP_APP_PASSWORD"
          --mail-from "$CALENDAR_ALERT_SMTP_USERNAME" --mail-rcpt-to andresgmr1@gmail.com
          --upload-file "$CALENDAR_NOTIFICATION_EMAIL_PATH"
        env:
          CALENDAR_ALERT_SMTP_USERNAME: ${{ secrets.CALENDAR_ALERT_SMTP_USERNAME }}
          CALENDAR_ALERT_SMTP_APP_PASSWORD: ${{ secrets.CALENDAR_ALERT_SMTP_APP_PASSWORD }}
          CALENDAR_NOTIFICATION_EMAIL_PATH: ${{ runner.temp }}/calendar-notification-email.txt

      - name: Upload calendar notification reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: calendar-notification-reports
          path: |
            ${{ runner.temp }}/calendar-historical-changes.json
            ${{ runner.temp }}/calendar-notifications.json
          if-no-files-found: warn
          retention-days: 30

      - name: Commit calendar changes
        run: |
          sync_paths=(
            src/app/data/calendarEvents.ts
            src/app/data/calendarEventRegistry.json
            src/app/data/eventGalleries.ts
            src/app/data/eventGalleryState.json
          )
          if [[ -d public/images/events ]] || git ls-files --error-unmatch public/images/events >/dev/null 2>&1; then
            sync_paths+=(public/images/events)
          fi

          if [[ -z "$(git status --porcelain -- "${sync_paths[@]}")" ]]; then
            echo "No calendar changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "${sync_paths[@]}"
          git commit -m "chore: sync calendar events"
          git push
