name: Sync calendar events
on:
  schedule:
    - cron: 0 9 * * *
  workflow_dispatch: null
permissions:
  contents: write
concurrency:
  group: site-writer-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  sync-calendar:
    name: Sync Google Calendar into site data
    runs-on: ubuntu-latest
    env:
      CALENDAR_ICS_URL: ${{ secrets.CALENDAR_ICS_URL }}
      CALENDAR_TIME_ZONE: America/Costa_Rica
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up project
        uses: ./.github/actions/setup-project
      - name: Sync calendar events
        id: sync
        run: pnpm run sync:calendar
        env:
          HISTORICAL_CHANGES_REPORT_PATH: ${{ runner.temp }}/calendar-historical-changes.json
          CALENDAR_NOTIFICATIONS_REPORT_PATH: ${{ runner.temp }}/calendar-notifications.json
      - name: Verify generated site
        id: verification
        uses: ./.github/actions/verify-site
        with:
          mode: calendar
      - name: Commit calendar changes
        run: node scripts/publish-changes.mjs calendar
        env:
          VERIFY_SITE_REPORT_DIR: ${{ runner.temp }}/site-verification
        id: publication
      - name: Review calendar design and notify
        if: ${{ always() }}
        uses: ./.github/actions/calendar-design-review
        with:
          publication-failed: ${{ steps.verification.outcome == 'failure' || steps.publication.outcome == 'failure' }}
          failed-step: ${{ steps.verification.outcome == 'failure' && 'site verification' || 'Git publication' }}
          git-saved: ${{ steps.publication.outcome == 'success' }}
          smtp-username: ${{ secrets.CALENDAR_ALERT_SMTP_USERNAME }}
          smtp-password: ${{ secrets.CALENDAR_ALERT_SMTP_APP_PASSWORD }}
          recipient: ${{ secrets.CALENDAR_ALERT_RECIPIENT }}
