name: Sync calendar events
on:
  schedule:
    - cron: 0 9 * * *
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: site-writer-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  prepare:
    name: Prepare and verify calendar changes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up project
        uses: ./.github/actions/setup-project
      - name: Sync calendar events
        id: sync
        run: pnpm run sync:calendar
        env:
          CALENDAR_ICS_URL: ${{ secrets.CALENDAR_ICS_URL }}
          CALENDAR_TIME_ZONE: America/Costa_Rica
          HISTORICAL_CHANGES_REPORT_PATH: ${{ runner.temp }}/calendar-historical-changes.json
          CALENDAR_NOTIFICATIONS_REPORT_PATH: ${{ runner.temp }}/calendar-notifications.json
      - name: Verify generated site
        id: verification
        uses: ./.github/actions/verify-site
        with:
          mode: calendar
      - name: Package verified source, build and reports
        id: handoff
        if: ${{ always() }}
        run: node scripts/calendar-handoff.mjs pack
        env:
          CALENDAR_PREPARED: ${{ steps.verification.outcome == 'success' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: calendar-handoff-${{ github.run_attempt }}
          path: ${{ runner.temp }}/calendar-handoff
          if-no-files-found: error
          retention-days: 30
        name: Retain calendar handoff
        if: ${{ always() && steps.handoff.outcome == 'success' }}
  publish:
    name: Publish verified calendar changes
    outputs:
      git-saved: ${{ steps.publication.outputs.git-saved }}
    needs: prepare
    if: ${{ needs.prepare.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node without dependencies
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: calendar-handoff-${{ github.run_attempt }}
          path: ${{ runner.temp }}/calendar-handoff
      - name: Publish guarded handoff
        id: publication
        run: node scripts/calendar-handoff.mjs publish
        env:
          VERIFY_SITE_REPORT_DIR: ${{ runner.temp }}/site-verification
          CALENDAR_PUBLICATION_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: calendar-publication-${{ github.run_attempt }}
          path: ${{ runner.temp }}/calendar-publication
          if-no-files-found: error
          retention-days: 30
        name: Retain publication result
        if: ${{ always() }}
  finalize:
    name: Review verified build and notify
    needs:
      - prepare
      - publish
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up project
        uses: ./.github/actions/setup-project
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: calendar-handoff-${{ github.run_attempt }}
          path: ${{ runner.temp }}/calendar-handoff
        name: Download calendar handoff
        id: download
        continue-on-error: true
      - name: Restore verified build and notification reports
        id: restore
        if: ${{ steps.download.outcome == 'success' }}
        continue-on-error: true
        run: node scripts/calendar-handoff.mjs restore
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: calendar-publication-${{ github.run_attempt }}
          path: ${{ runner.temp }}/site-verification
        name: Download publication result
        if: ${{ needs.publish.result == 'success' }}
        continue-on-error: true
      - name: Install Chromium for design review
        if: ${{ needs.publish.result == 'success' && steps.restore.outcome == 'success' }}
        continue-on-error: true
        run: pnpm exec playwright install --with-deps chromium
      - name: Review calendar design and notify
        if: ${{ always() }}
        uses: ./.github/actions/calendar-design-review
        with:
          publication-failed: ${{ needs.prepare.result != 'success' || needs.publish.result != 'success' || steps.restore.outcome != 'success' }}
          failed-step: ${{ needs.prepare.result != 'success' && 'preparation or site verification' || needs.publish.result != 'success' && 'Git publication' || 'handoff restoration' }}
          git-saved: ${{ needs.publish.outputs.git-saved == 'true' }}
          smtp-username: ${{ secrets.CALENDAR_ALERT_SMTP_USERNAME }}
          smtp-password: ${{ secrets.CALENDAR_ALERT_SMTP_APP_PASSWORD }}
          recipient: ${{ secrets.CALENDAR_ALERT_RECIPIENT }}
env:
  CALENDAR_OPERATION: calendar
