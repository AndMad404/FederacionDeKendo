<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Federación de Asociaciones de Kendo</title>
  <desc id="desc">Tarjeta social horizontal para compartir el sitio oficial de la Federación de Asociaciones de Kendo.</desc>
  <defs>
    <style>
      .sans { font-family: Arial, Helvetica, sans-serif; }
      .bold { font-weight: 700; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#ffffff"/>

  <text class="sans bold" x="60" y="191" fill="#1d4ed8" font-size="25" letter-spacing="1.2">SITIO OFICIAL</text>
  <text class="sans bold" x="60" y="254" fill="#0f172a" font-size="58">
    <tspan x="60" dy="0">Federación de</tspan>
    <tspan x="60" dy="68">Asociaciones de Kendo</tspan>
  </text>
  <text class="sans bold" x="60" y="367" fill="#1e3a8a" font-size="34">El camino de la espada</text>
  <text class="sans" x="60" y="423" fill="#334155" font-size="25">
    <tspan x="60" dy="0">Comunidad, galería y dojos afiliados para practicar</tspan>
    <tspan x="60" dy="35">kendo con disciplina, respeto y continuidad.</tspan>
  </text>
  <image href="../logo/fakcr-logo.png" x="714" y="32" width="459" height="566" preserveAspectRatio="xMidYMid meet"/>

</svg>
