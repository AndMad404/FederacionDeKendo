<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Federación de Asociaciones de Kendo</title>
  <desc id="desc">Tarjeta social horizontal para compartir el sitio oficial de la Federación de Asociaciones de Kendo.</desc>
  <defs>
    <style>
      .sans { font-family: Arial, Helvetica, sans-serif; }
      .bold { font-weight: 700; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#ffffff"/>

  <text class="sans bold" x="407" y="174" text-anchor="middle" fill="#1d4ed8" font-size="22" letter-spacing="1.2">SITIO OFICIAL</text>
  <text class="sans bold" x="407" y="226" text-anchor="middle" fill="#0f172a" font-size="52">
    <tspan x="407" dy="0">Federación de</tspan>
    <tspan x="407" dy="62">Asociaciones de Kendo</tspan>
  </text>
  <text class="sans bold" x="407" y="326" text-anchor="middle" fill="#1e3a8a" font-size="30">El camino de la espada</text>
  <text class="sans" x="407" y="374" text-anchor="middle" fill="#334155" font-size="22">
    <tspan x="407" dy="0">Comunidad, galería y dojos afiliados para practicar</tspan>
    <tspan x="407" dy="31">kendo con disciplina, respeto y continuidad.</tspan>
  </text>
  <image href="../logo/fakcr-logo.png" x="716" y="65" width="420" height="500" preserveAspectRatio="xMidYMid meet"/>

</svg>
